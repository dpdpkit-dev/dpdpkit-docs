# Build on every PR; deploy to GitHub Pages on main ("dev") and on tags vX.Y.Z (versioned with mike).
name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out dpdpkit-core and dpdpkit-fastapi for the API reference
        uses: actions/checkout@v7
        with:
          repository: dpdpkit-dev/dpdpkit-core
          path: _siblings/dpdpkit-core
      - uses: actions/checkout@v7
        with:
          repository: dpdpkit-dev/dpdpkit-fastapi
          path: _siblings/dpdpkit-fastapi
      - name: Check out dpdpkit-react for the Storybook
        uses: actions/checkout@v7
        with:
          repository: dpdpkit-dev/dpdpkit-react
          path: _siblings/dpdpkit-react
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _siblings/dpdpkit-react/package-lock.json
      - name: Build the Storybook
        working-directory: _siblings/dpdpkit-react
        run: |
          npm ci
          npm run build-storybook
      - run: pip install -r requirements.txt
      - name: Generate the rule-to-code page and stage API sources and the Storybook
        run: |
          python scripts/gen_rule_map.py
          python scripts/stage_api_src.py _siblings
          python scripts/stage_storybook.py _siblings
      - run: mkdocs build --strict
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables); see README.
          DPDPKIT_WAITLIST_ACTION: ${{ vars.WAITLIST_ACTION }}
          DPDPKIT_WAITLIST_PROCESSOR: ${{ vars.WAITLIST_PROCESSOR }}
      - name: Deploy
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            minor="${version%.*}"
            mike deploy --push --update-aliases "$minor" latest
            mike set-default --push latest
          else
            mike deploy --push dev
          fi
