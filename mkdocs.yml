site_name: dpdpkit
site_description: Developer toolkit for India's DPDP Act, 2023 and DPDP Rules, 2025
site_url: https://dpdpkit.dev/
repo_url: https://github.com/dpdpkit-dev/dpdpkit-docs
edit_uri: edit/main/docs/
copyright: Apache-2.0 · dpdpkit helps implement obligations; it is not legal advice and does not guarantee compliance.

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

extra:
  version:
    provider: mike
  waitlist:  # docs/waitlist.md, backend in waitlist/; the form stays disabled until action and processor are set
    action: !ENV [DPDPKIT_WAITLIST_ACTION, ""]        # form endpoint that accepts a plain HTML POST
    processor: !ENV [DPDPKIT_WAITLIST_PROCESSOR, ""]  # service behind it, named in the notice
    contact: privacy@dpdpkit.dev  # placeholder until the domain is registered (SETUP-05)
    notice_version: "2026-10-31"  # bump whenever the notice in docs/waitlist.md changes

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [build/api-src]  # written by scripts/stage_api_src.py
          options:
            extensions: [scripts/griffe_sphinx_roles.py:SphinxRoles]
            show_if_no_docstring: true
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }

nav:
  - Home: index.md
  - Getting started:
      - FastAPI quickstart: getting-started/fastapi.md
      - Any other stack: getting-started/other-stacks.md
  - Packages:
      - Package index: packages/index.md
      - dpdpkit: packages/dpdpkit.md
      - dpdpkit-core: packages/dpdpkit-core.md
      - dpdpkit-policies: packages/dpdpkit-policies.md
      - Policy overlays: packages/policy-overlays.md
      - dpdpkit-fastapi: packages/dpdpkit-fastapi.md
      - dpdpkit-django: packages/dpdpkit-django.md
      - Page template: packages/template.md
  - Concepts:
      - Policy packs: concepts/policy-packs.md
      - Consent ledger: concepts/ledger.md
      - Retention and erasure: concepts/retention.md
  - Guides:
      - Industry purpose templates: guides/purpose-templates.md
      - Data-mapping workbook: guides/data-mapping.md
      - Notice review: guides/notice-review.md
      - Anchoring the root hash: guides/anchoring.md
      - Webhooks: guides/webhooks.md
      - Email delivery: guides/email.md
  - Reference:
      - Rule to code: reference/rule-to-code.md
      - REST contract: reference/rest.md
      - React components: reference/react.md
      - Versioning and deprecation: reference/deprecation.md
      - Python API:
          - Overview: reference/python/index.md
          - Kit and configuration: reference/python/kit.md
          - Consent and notices: reference/python/consent.md
          - Rights requests: reference/python/rights.md
          - Retention and erasure: reference/python/retention.md
          - Ledger: reference/python/ledger.md
          - Events and notifications: reference/python/events.md
          - Export: reference/python/export.md
          - Storage: reference/python/storage.md
          - Models and errors: reference/python/models.md
          - FastAPI adapter: reference/python/fastapi.md
          - Django app: reference/python/django.md
  - Cloud waitlist: waitlist.md
